# Docker Compose: yerel "stage/preview" ve ileride production önizlemesi için
# tüm servisleri ayağa kaldırır. Doğrulama Go toolchain + host üzerinde yapılır;
# bu dosya ortam provası içindir.

name: a2a-research-crew

x-agent-env: &agent-env
  env_file:
    - .env
  restart: unless-stopped

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crew}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crew}
      POSTGRES_DB: ${POSTGRES_DB:-crew}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crew} -d ${POSTGRES_DB:-crew}"]
      interval: 5s
      timeout: 5s
      retries: 10

  orchestrator:
    <<: *agent-env
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        BINARY: orchestrator
    command: ["-grpc-port=9100", "-card-port=9200", "-log-level=${LOG_LEVEL:-info}"]
    ports:
      - "${ORCHESTRATOR_GRPC_PORT:-9100}:9100"
      - "${ORCHESTRATOR_CARD_PORT:-9200}:9200"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      AGENT_ADVERTISE_HOST: orchestrator

  market-scout:
    <<: *agent-env
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        BINARY: market-scout
    command: ["-grpc-port=9101", "-card-port=9201", "-log-level=${LOG_LEVEL:-info}"]
    ports:
      - "${MARKET_SCOUT_GRPC_PORT:-9101}:9101"
      - "${MARKET_SCOUT_CARD_PORT:-9201}:9201"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      AGENT_ADVERTISE_HOST: market-scout

  competitor-analyst:
    <<: *agent-env
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        BINARY: competitor-analyst
    command: ["-grpc-port=9102", "-card-port=9202", "-log-level=${LOG_LEVEL:-info}"]
    ports:
      - "${COMPETITOR_ANALYST_GRPC_PORT:-9102}:9102"
      - "${COMPETITOR_ANALYST_CARD_PORT:-9202}:9202"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      AGENT_ADVERTISE_HOST: competitor-analyst
      MCP_SQLITE_DIR: /tmp/a2a/sqlite

  report-writer:
    <<: *agent-env
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        BINARY: report-writer
    command: ["-grpc-port=9103", "-card-port=9203", "-log-level=${LOG_LEVEL:-info}"]
    ports:
      - "${REPORT_WRITER_GRPC_PORT:-9103}:9103"
      - "${REPORT_WRITER_CARD_PORT:-9203}:9203"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      AGENT_ADVERTISE_HOST: report-writer
      MCP_FS_ROOT: /tmp/a2a/workspace

  # Opsiyonel: BLOB_STORE=s3/minio kullanmak için "minio" profiliyle açın.
  minio:
    image: minio/minio:latest
    profiles: ["minio"]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
